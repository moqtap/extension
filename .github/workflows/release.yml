name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repo keeps no CHANGELOG.md. What changed in a release is written
      # into the annotated tag, which puts the notes next to the thing they
      # describe, makes them immutable once pushed, and leaves nowhere for an
      # "Unreleased" section to sit and go stale.
      - name: Take the release notes from the tag message
        # Written outside the workspace so it cannot end up inside the sources
        # zip that `zip:firefox` builds.
        run: |
          tag='${{ github.ref_name }}'
          notes='${{ runner.temp }}/NOTES.md'
          message='${{ runner.temp }}/TAG_MESSAGE.md'

          # actions/checkout leaves refs/tags/<tag> pointing at the commit, so
          # the annotated object the notes live in is not in the workspace at
          # all. Fetch the ref as the remote holds it before asking its type.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"

          if [ "$(git cat-file -t "$tag")" != 'tag' ]; then
            echo "::error::$tag is a lightweight tag and carries no message." \
                 "Release notes live in the tag: git tag -a $tag -F notes.md"
            exit 1
          fi

          # Emptiness is a property of the tag message, so it is checked before
          # the heading below makes the file non-empty regardless.
          git tag -l --format='%(contents)' "$tag" > "$message"
          if [ ! -s "$message" ]; then
            echo "::error::$tag has an empty message, so there are no release" \
                 "notes to publish."
            exit 1
          fi

          {
            printf '## Release Notes\n\n'
            cat "$message"
          } > "$notes"

          sed "s|@@TAG@@|$tag|g" .github/release-footer.md >> "$notes"

      # The tag names the release; package.json's version is what reaches the
      # built manifest and the store listing. A release where they disagree
      # ships a zip whose version is not the one being announced.
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != '${{ github.ref_name }}' ]; then
            echo "::error::tag ${{ github.ref_name }} does not match" \
                 "package.json version $version"
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Build and zip Chrome
        run: |
          bun run build
          bun run zip

      - name: Build and zip Firefox
        run: |
          bun run build:firefox
          bun run zip:firefox

      - name: Rename zips for release
        run: |
          mv .output/*-chrome.zip .output/moqtap-chrome-${{ github.ref_name }}.zip
          mv .output/*-firefox.zip .output/moqtap-firefox-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .output/moqtap-chrome-${{ github.ref_name }}.zip
            .output/moqtap-firefox-${{ github.ref_name }}.zip
          # Appends the compare link, and any merged PRs, under the notes.
          generate_release_notes: true
          body_path: ${{ runner.temp }}/NOTES.md
